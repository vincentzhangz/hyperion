[package]
name = "hyperion-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated browser profiles with encrypted local/S3 persistence and catalog leases"

[features]
default = ["postgres"]
postgres = ["dep:postgres"]

[dependencies]
chacha20poly1305 = "0.10"
hex = "0.4"
hmac = "0.12"
hyperion-config = { path = "../hyperion-config" }
hyperion-metrics = { path = "../hyperion-metrics" }
hyperion-net = { path = "../hyperion-net" }
postgres = { version = "0.19", optional = true }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
